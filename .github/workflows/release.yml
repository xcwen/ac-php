name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v2.8.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  verify:
    name: Verify Rust project
    runs-on: ubuntu-24.04

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a SemVer-style tag such as v2.8.0, got: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup component add --toolchain "$RUST_TOOLCHAIN" clippy rustfmt

      - name: Check formatting
        working-directory: ac-php-mago-tags
        run: cargo "+$RUST_TOOLCHAIN" fmt --all -- --check

      - name: Run tests
        working-directory: ac-php-mago-tags
        run: cargo "+$RUST_TOOLCHAIN" test --locked

      - name: Run Clippy
        working-directory: ac-php-mago-tags
        run: cargo "+$RUST_TOOLCHAIN" clippy --all-targets --locked -- -D warnings

  build-mago-tags:
    name: Build ${{ matrix.asset }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: linux-x86_64
            linux: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: linux-aarch64
            linux: true
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: macos-x86_64
            linux: false
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: macos-aarch64
            linux: false

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a SemVer-style tag such as v2.8.0, got: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install musl build tools
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          mkdir -p ac-php-mago-tags/.cargo
          printf '[target.%s]\nlinker = "musl-gcc"\n' \
            "${{ matrix.target }}" > ac-php-mago-tags/.cargo/config.toml

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup target add --toolchain "$RUST_TOOLCHAIN" "${{ matrix.target }}"

      - name: Build release binary
        working-directory: ac-php-mago-tags
        run: |
          cargo "+$RUST_TOOLCHAIN" build --release --locked --target "${{ matrix.target }}"

      - name: Smoke test binary
        working-directory: ac-php-mago-tags
        run: |
          "target/${{ matrix.target }}/release/ac-php-mago-tags" --version

      - name: Package binary
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          package="ac-php-mago-tags-${RELEASE_TAG}-${ASSET}"
          mkdir -p "dist/$package"
          install -m 755 \
            "ac-php-mago-tags/target/${{ matrix.target }}/release/ac-php-mago-tags" \
            "dist/$package/ac-php-mago-tags"
          cp ac-php-mago-tags/README.md "dist/$package/README.md"
          tar -czf "dist/$package.tar.gz" -C dist "$package"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build-mago-tags
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a SemVer-style tag such as v2.8.0, got: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Download binary packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Package repository source
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          git archive \
            --format=tar.gz \
            --prefix="ac-php-${RELEASE_TAG}/" \
            --output="dist/ac-php-${RELEASE_TAG}.tar.gz" \
            "$RELEASE_TAG"

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/*.tar.gz \
              dist/SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "ac-php $RELEASE_TAG"
          fi
