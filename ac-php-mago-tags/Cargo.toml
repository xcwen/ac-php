[package]
name = "ac-php-mago-tags"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Fast Mago-based tag generator for ac-php"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
postcard = { version = "1.1", features = ["use-std"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
walkdir = "2.5"

# Keep these versions aligned. Mago's Rust API is not stable before 2.0.
mago-allocator = "=1.47.4"
mago-codex = "=1.47.4"
mago-database = "=1.47.4"
mago-names = "=1.47.4"
mago-php-version = "=1.47.4"
mago-span = "=1.47.4"
mago-syntax = "=1.47.4"
mago-word = "=1.47.4"

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
